<!DOCTYPE html>
<html class="light" lang="vi">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Tin nhắn | Locafy</title>
    <script src="../env.js"></script>
    <script src="../supabase-client.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../design-system.css">
    <script src="../design-system.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFAF9; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
    <script>
        // Auth Guard
        const currentUser = JSON.parse(localStorage.getItem('locafyCurrentUser'));
        if (!currentUser) {
            alert('Vui lòng đăng nhập để xem tin nhắn!');
            window.location.href = '../login.html?redirect=user/message.html';
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col h-screen overflow-hidden">
    <!-- Header giống index.html -->
    <header class="bg-white shadow-sm shrink-0 z-50">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-3 sm:py-0 min-h-16 sm:min-h-20 flex flex-col gap-2.5 md:flex-row md:items-center md:justify-between">
            <div class="flex items-center justify-between md:justify-start">
                <a href="../index.html" class="flex items-center justify-center md:justify-start min-w-0 transition-transform active:scale-95 duration-200">
                    <img src="../images/docx/logo.png" alt="Locafy Logo" class="h-11 sm:h-12 object-contain">
                </a>
            </div>
            <nav class="hidden md:flex space-x-8 font-medium">
                <a href="../index.html" class="text-gray-600 hover:text-blue-600">Trang Chủ</a>
                <a href="../phong-tro.html" class="text-gray-600 hover:text-blue-600">Phòng Trọ</a>
            </nav>
            <div id="auth-actions" class="flex flex-col items-stretch gap-2 w-full md:w-auto md:flex-row md:items-center md:justify-end">
                <!-- Dropdown rendered by JS -->
            </div>
        </div>
    </header>

    <!-- Main Content (Chat UI) -->
    <main class="flex-1 max-w-7xl mx-auto w-full flex bg-white border-x border-stone-200 overflow-hidden shadow-sm">
        
        <!-- Left Side Conversations List -->
        <section class="w-80 border-r border-stone-200 flex flex-col bg-stone-50/50 shrink-0">
            <div class="p-4 border-b border-stone-100 bg-white">
                <h2 class="font-bold text-lg text-gray-800 mb-3">Tin nhắn</h2>
                <div class="relative w-full">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-[18px]">search</span>
                    <input class="w-full bg-stone-50 text-stone-800 placeholder-stone-400 rounded-xl pl-10 pr-4 py-2 border border-stone-200 focus:ring-2 focus:ring-blue-500 outline-none text-xs" placeholder="Tìm kiếm tin nhắn..." type="text">
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto no-scrollbar py-2" id="conversations-list">
                <!-- Conversations list -->
            </div>
        </section>

        <!-- Right Side Messaging Feed -->
        <section class="flex-1 flex flex-col bg-white h-full relative">
            <!-- Chat Window Header -->
            <div class="h-[72px] border-b border-stone-100 flex items-center px-6 bg-white shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm border border-blue-200" id="chat-header-avatar">
                        --
                    </div>
                    <div>
                        <h2 id="chat-header-name" class="font-bold text-base text-gray-800 leading-snug">Chủ nhà</h2>
                        <div class="flex items-center gap-1 text-green-500 text-[10px] font-semibold">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                            Đang hoạt động
                        </div>
                    </div>
                </div>
            </div>

            <!-- Feed -->
            <div id="message-container" class="flex-grow overflow-y-auto p-6 space-y-4 bg-stone-50/30">
                <!-- Loaded dynamically -->
            </div>

            <!-- Textbox -->
            <div class="bg-white border-t border-stone-100 p-4 shrink-0">
                <div class="flex items-center gap-2 bg-stone-50 border border-stone-200 rounded-2xl p-2 focus-within:ring-2 focus-within:ring-blue-500 focus-within:bg-white transition-all shadow-inner">
                    <input id="chat-input" class="flex-grow bg-transparent border-none focus:ring-0 text-sm py-2 px-3 text-gray-800 placeholder-stone-400 outline-none" placeholder="Nhập tin nhắn..." type="text">
                    <button onclick="sendMessage()" class="bg-blue-600 text-white w-9 h-9 rounded-full flex items-center justify-center hover:bg-blue-700 active:scale-95 transition-all shadow-sm shrink-0">
                        <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">send</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script src="../supabase-client.js"></script>
    <script>
        const currentUserKey = 'locafyCurrentUser';
        const authActions = document.getElementById('auth-actions');
        function getCurrentUser() { try { return JSON.parse(localStorage.getItem(currentUserKey)); } catch(e) { return null; } }
        function getInitials(user) { return (user.name || user.username || 'U').substring(0, 2).toUpperCase(); }
        function buildDropdownItems(user) {
            return `<a href="account-settings.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors font-medium"><i class="fa-solid fa-gear text-blue-600 w-4 text-center"></i>Cài đặt tài khoản</a><a href="notification.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors font-medium"><i class="fa-solid fa-bell text-blue-600 w-4 text-center"></i>Thông báo</a><a href="message.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors font-medium bg-gray-50"><i class="fa-solid fa-message text-blue-600 w-4 text-center"></i>Tin nhắn</a><a href="appointments.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors font-medium"><i class="fa-solid fa-calendar-check text-blue-600 w-4 text-center"></i>Lịch xem phòng</a><hr class="border-gray-100 my-1"><button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors font-medium text-left"><i class="fa-solid fa-right-from-bracket w-4 text-center"></i>Đăng xuất</button>`;
        }
        function updateAuthUI() {
            const user = getCurrentUser();
            if (!user) return;
            const initials = getInitials(user);
            const html = `<div class="flex items-center gap-3"><a href="notification.html" class="relative flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 hover:bg-gray-50 text-gray-500 hover:text-blue-600 transition-all active:scale-95 shadow-sm" title="Thông báo"><i class="fa-regular fa-bell text-lg"></i></a><div class="relative inline-block text-left"><button id="user-avatar-btn" class="flex items-center justify-center w-10 h-10 rounded-full bg-blue-600 text-white font-bold text-sm hover:bg-blue-700 transition-all active:scale-95 focus:outline-none shadow-md" onclick="toggleUserDropdown(event)">${initials}</button><div id="user-avatar-dropdown" class="hidden absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-xl border border-gray-200/60 py-2 z-50"><div class="px-4 py-3 border-b border-gray-100"><p class="text-sm font-bold text-gray-900">${user.name || user.username}</p><p class="text-xs text-gray-500">${user.email || ''}</p></div>${buildDropdownItems(user)}</div></div></div>`;
            if (authActions) authActions.innerHTML = html;
        }
        window.toggleUserDropdown = function(e) { e.stopPropagation(); const dd = document.getElementById('user-avatar-dropdown'); if (dd) dd.classList.toggle('hidden'); };
        document.addEventListener('click', function(e) { const dd = document.getElementById('user-avatar-dropdown'); const btn = document.getElementById('user-avatar-btn'); if (dd && btn && !dd.contains(e.target) && !btn.contains(e.target)) dd.classList.add('hidden'); });
        updateAuthUI();

        window.logout = function() {
            localStorage.removeItem('locafyCurrentUser');
            window.location.href = '../index.html';
        };

        // --- Chat Logic ---
        let activeChatKey = ''; // username of the seller
        let sellersList = [];
        let sellerChats = {}; // map of seller username -> list of messages

        async function loadConversations() {
            let accounts = [];
            if (window.db) {
                accounts = await window.db.getAccounts();
            } else {
                accounts = JSON.parse(localStorage.getItem('locafyAccounts') || '[]');
            }
            sellersList = accounts.filter(acc => acc.role === 'seller');

            for (let seller of sellersList) {
                const chatId = `${seller.username}_${currentUser.username}`;
                let messages = [];
                if (window.db) {
                    messages = await window.db.getChats(chatId, currentUser.username);
                } else {
                    const allChats = JSON.parse(localStorage.getItem('locafyChats') || '{}');
                    messages = allChats[chatId] || [];
                }
                sellerChats[seller.username] = messages;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const chatParam = urlParams.get('chat');
            if (chatParam && sellersList.some(s => s.username === chatParam)) {
                activeChatKey = chatParam;
            } else if (sellersList.length > 0 && !activeChatKey) {
                activeChatKey = sellersList[0].username;
            }

            renderConversationsList();
            renderMessages();
        }

        function renderConversationsList() {
            const listContainer = document.getElementById('conversations-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            sellersList.forEach(seller => {
                const messages = sellerChats[seller.username] || [];
                const lastMsg = messages.length > 0 ? messages[messages.length - 1].text : 'Chưa có tin nhắn...';
                const lastTime = messages.length > 0 ? messages[messages.length - 1].time : '';
                const name = seller.name || seller.username;
                const initials = name.substring(0, 2).toUpperCase();

                const div = document.createElement('div');
                const isActive = seller.username === activeChatKey;
                div.className = `px-4 py-3 cursor-pointer flex gap-3 items-center border-l-4 transition-all ${
                    isActive ? 'bg-blue-50/80 border-blue-600 font-semibold' : 'hover:bg-stone-100/50 border-transparent'
                }`;
                div.onclick = () => selectChat(seller.username);
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm shrink-0 border border-blue-200 shadow-sm">${initials}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline mb-0.5">
                            <h3 class="font-bold text-xs text-gray-900 truncate">${name}</h3>
                            <span class="text-[10px] text-gray-400">${lastTime}</span>
                        </div>
                        <p class="text-xs text-gray-500 truncate">${lastMsg}</p>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function renderMessages() {
            const seller = sellersList.find(s => s.username === activeChatKey);
            if (!seller) return;

            const name = seller.name || seller.username;
            const initials = name.substring(0, 2).toUpperCase();

            document.getElementById('chat-header-name').textContent = name;
            document.getElementById('chat-header-avatar').textContent = initials;

            const container = document.getElementById('message-container');
            container.innerHTML = '';

            const messages = sellerChats[activeChatKey] || [];

            messages.forEach(msg => {
                const div = document.createElement('div');
                
                if (msg.sender === 'receiver') {
                    // Left bubble (from landlord)
                    div.className = "flex gap-2 max-w-[80%]";
                    div.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs shrink-0 mt-auto border border-blue-200">${initials}</div>
                        <div>
                            <div class="bg-white border border-stone-200/60 px-4 py-2.5 rounded-2xl rounded-bl-sm text-gray-700 text-sm shadow-sm">
                                ${msg.text}
                            </div>
                            <span class="text-[10px] text-gray-400 mt-1 block ml-1">${msg.time}</span>
                        </div>
                    `;
                } else {
                    // Right bubble (from tenant)
                    div.className = "flex gap-2 max-w-[80%] ml-auto justify-end";
                    div.innerHTML = `
                        <div class="flex flex-col items-end">
                            <div class="bg-blue-600 text-white px-4 py-2.5 rounded-2xl rounded-br-sm text-sm shadow-sm font-medium">
                                ${msg.text}
                            </div>
                            <span class="text-[10px] text-gray-400 mt-1 block mr-1">${msg.time}</span>
                        </div>
                    `;
                }
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        window.selectChat = function(sellerUsername) {
            activeChatKey = sellerUsername;
            renderConversationsList();
            renderMessages();
        };

        window.sendMessage = async function() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !activeChatKey) return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
            const chatId = `${activeChatKey}_${currentUser.username}`;
            
            const message = {
                sender: 'sender',
                text: text,
                time: timeStr
            };

            if (window.db) {
                await window.db.saveChatMessage(chatId, message, currentUser.username);
            } else {
                const chats = JSON.parse(localStorage.getItem('locafyChats') || '{}');
                if (!chats[chatId]) chats[chatId] = [];
                chats[chatId].push(message);
                localStorage.setItem('locafyChats', JSON.stringify(chats));
            }

            if (!sellerChats[activeChatKey]) sellerChats[activeChatKey] = [];
            sellerChats[activeChatKey].push(message);

            input.value = '';
            renderMessages();
            renderConversationsList();
        };

        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function init() {
            let attempts = 0;
            while (!window.db && attempts < 50) {
                await new Promise(r => setTimeout(r, 100));
                attempts++;
            }
            await loadConversations();

            // Real-time polling
            setInterval(async () => {
                if (!activeChatKey) return;
                let accounts = [];
                if (window.db) {
                    accounts = await window.db.getAccounts();
                } else {
                    accounts = JSON.parse(localStorage.getItem('locafyAccounts') || '[]');
                }
                sellersList = accounts.filter(acc => acc.role === 'seller');

                let changed = false;
                for (let seller of sellersList) {
                    const chatId = `${seller.username}_${currentUser.username}`;
                    let messages = [];
                    if (window.db) {
                        messages = await window.db.getChats(chatId, currentUser.username);
                    } else {
                        const allChats = JSON.parse(localStorage.getItem('locafyChats') || '{}');
                        messages = allChats[chatId] || [];
                    }
                    
                    const oldLen = (sellerChats[seller.username] || []).length;
                    if (messages.length > oldLen) {
                        sellerChats[seller.username] = messages;
                        changed = true;
                    }
                }
                
                if (changed) {
                    renderConversationsList();
                    renderMessages();
                }
            }, 3000);
        }
        init();
    </script>
</body>
</html>
